<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختبار HL ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #ffe6f1, #e8e0ff, #dff6ff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #4d4352;
}

.container {
    width: 100%;
    max-width: 700px;
}

.card {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(120, 100, 140, 0.15);
}

h1 {
    text-align: center;
    margin-top: 0;
    color: #765b7a;
}

.subtitle {
    text-align: center;
    color: #8d7b91;
    margin-bottom: 25px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
    color: #88778c;
}

.progress-bar {
    height: 10px;
    background: #eee5f0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

#progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #dca9d6, #aeb9ee);
    border-radius: 20px;
    transition: width 0.3s ease;
}

#questionBox {
    min-height: 180px;
}

.question {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.8;
    text-align: center;
    margin-bottom: 25px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    border: none;
    background: #faf5fb;
    border: 2px solid #eee3f0;
    border-radius: 18px;
    padding: 15px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    color: #514756;
}

.option:hover {
    transform: translateY(-2px);
    background: #f4eafa;
}

.option.selected {
    background: #e9def5;
    border-color: #b797c4;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.buttons button {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 16px;
    font-family: inherit;
    cursor: pointer;
    font-size: 15px;
}

#back {
    background: #eee8f0;
    color: #625666;
}

#next {
    background: #c9b2dc;
    color: white;
}

#next:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#result {
    display: none;
    text-align: center;
}

.result-title {
    font-size: 27px;
    font-weight: 700;
    margin-bottom: 10px;
}

.result-description {
    line-height: 1.9;
    color: #6d6170;
}

.result-list {
    margin-top: 25px;
    text-align: right;
}

.result-item {
    background: #faf6fb;
    padding: 13px 16px;
    border-radius: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
}

.note {
    margin-top: 20px;
    font-size: 12px;
    color: #9b8fa0;
    line-height: 1.7;
}

.restart {
    margin-top: 20px;
    width: 100%;
    border: none;
    background: #c9b2dc;
    color: white;
    padding: 14px;
    border-radius: 16px;
    font-family: inherit;
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="quiz">

    <h1>اختبار HL ♡</h1>

    <div class="subtitle">
        اختبار بسيط لمعرفة الشيء الذي تميلين له حاليًا
    </div>

    <div class="progress-info">
        <span id="counter">السؤال 1 من 30</span>
        <span id="percent">0%</span>
    </div>

    <div class="progress-bar">
        <div id="progress"></div>
    </div>

    <div id="questionBox"></div>

    <div class="buttons">
        <button id="back" onclick="previousQuestion()">السابق</button>
        <button id="next" onclick="nextQuestion()" disabled>التالي</button>
    </div>

</div>


<div class="card" id="result">

    <h1>النتيجة ♡</h1>

    <div class="result-title" id="resultTitle"></div>

    <div class="result-description" id="resultDescription"></div>

    <div class="result-list" id="resultList"></div>

    <div class="note">
        هذا الاختبار للمتعة فقط، ولا يكشف مسار حياتك الحقيقي
        ولا يستطيع التنبؤ بالمستقبل. البشر للأسف ما زالوا أعقد من 30 سؤالًا.
    </div>

    <button class="restart" onclick="restartQuiz()">
        إعادة الاختبار
    </button>

</div>

</div>

let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);


function renderQuestion() {

    const question = questions[currentQuestion];

    const questionBox = document.getElementById("questionBox");

    questionBox.innerHTML = "";

    const questionElement = document.createElement("div");
    questionElement.className = "question";
    questionElement.textContent = question.q;

    questionBox.appendChild(questionElement);

    const optionsContainer = document.createElement("div");
    optionsContainer.className = "options";

    question.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";
        button.textContent =
            String.fromCharCode(65 + index) + " · " + option[0];

        if (answers[currentQuestion] === index) {
            button.classList.add("selected");
        }

        button.onclick = function () {
            selectAnswer(index);
        };

        optionsContainer.appendChild(button);

    });

    questionBox.appendChild(optionsContainer);

    document.getElementById("counter").textContent =
        `السؤال ${currentQuestion + 1} من ${questions.length}`;

    const percentage =
        Math.round((currentQuestion / questions.length) * 100);

    document.getElementById("percent").textContent =
        percentage + "%";

    document.getElementById("progress").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    document.getElementById("back").disabled =
        currentQuestion === 0;

    document.getElementById("next").disabled =
        answers[currentQuestion] === null;

    document.getElementById("next").textContent =
        currentQuestion === questions.length - 1
        ? "عرض النتيجة"
        : "التالي";
}


function selectAnswer(index) {

    answers[currentQuestion] = index;

    renderQuestion();
}


function previousQuestion() {

    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}


function nextQuestion() {

    if (answers[currentQuestion] === null) {
        return;
    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;
        renderQuestion();

    } else {

        showResult();

    }
}


function showResult() {

    const scores = {

        creative: 0,
        explore: 0,
        knowledge: 0,
        freedom: 0,
        stability: 0,
        social: 0

    };


    answers.forEach((answer, questionIndex) => {

        if (answer !== null) {

            const type =
                questions[questionIndex].options[answer][1];

            scores[type]++;

        }

    });


    const sorted = Object.entries(scores)
        .sort((a, b) => b[1] - a[1]);


    const highestScore = sorted[0][1];

    const winners = sorted
        .filter(item => item[1] === highestScore)
        .map(item => item[0]);


    const winnerNames =
        winners.map(type => types[type].name).join(" + ");


    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("resultTitle").textContent =
        winnerNames;


    document.getElementById("resultDescription").textContent =
        types[winners[0]].description;


    const resultList =
        document.getElementById("resultList");

    resultList.innerHTML = "";


    sorted.forEach(([type, score]) => {

        const percentage =
            Math.round((score / questions.length) * 100);

        const item =
            document.createElement("div");

        item.className = "result-item";

        item.innerHTML = `
            <span>${types[type].name}</span>
            <strong>${percentage}%</strong>
        `;

        resultList.appendChild(item);

    });

}


function restartQuiz() {

    currentQuestion = 0;

    answers =
        new Array(questions.length).fill(null);

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";

    renderQuestion();

}


/* تشغيل السؤال الأول */
renderQuestion();

</script>
